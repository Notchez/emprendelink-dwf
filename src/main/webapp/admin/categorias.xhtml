<?xml version="1.0" encoding="UTF-8"?>

<!DOCTYPE html>

<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">

<h:head>

    <title>
        Administrar categorías - EmprendeLink
    </title>

    <link rel="stylesheet"
          href="#{request.contextPath}/css/estilos.css"/>

</h:head>

<h:body>

    <main>

        <h1>Administrar categorías</h1>

        <p>
            <a href="#{request.contextPath}/admin/usuarios.xhtml">
                Volver a administración
            </a>
        </p>

        <h:form id="categoriasForm">

            <h:messages
                    id="mensajes"
                    globalOnly="true"/>

            <h2>
                <h:outputText
                        value="#{categoriaBean.editando
                    ? 'Editar categoría'
                    : 'Nueva categoría'}"/>
            </h2>

            <h:outputLabel
                    for="nombre"
                    value="Nombre"/>

            <h:inputText
                    id="nombre"
                    value="#{categoriaBean.nombre}"
                    required="true"
                    requiredMessage="El nombre es obligatorio."
                    maxlength="80">

                <f:ajax
                        event="blur"
                        execute="@this"
                        render="nombreMensaje"/>

            </h:inputText>

            <h:message
                    id="nombreMensaje"
                    for="nombre"/>

            <br/><br/>

            <h:outputLabel
                    for="descripcion"
                    value="Descripción"/>

            <h:inputTextarea
                    id="descripcion"
                    value="#{categoriaBean.descripcion}"
                    rows="4"
                    cols="50"/>

            <br/><br/>

            <h:commandButton
                    value="#{categoriaBean.editando
                ? 'Guardar cambios'
                : 'Crear categoría'}"
                    action="#{categoriaBean.guardar}">

                <f:ajax
                        execute="@form"
                        render="@form"/>

            </h:commandButton>

            <h:commandButton
                    value="Cancelar edición"
                    rendered="#{categoriaBean.editando}"
                    action="#{categoriaBean.cancelarEdicion}"
                    immediate="true">

                <f:ajax
                        execute="@this"
                        render="@form"/>

            </h:commandButton>

            <hr/>

            <h2>Categorías registradas</h2>

            <h:dataTable
                    id="tabla"
                    value="#{categoriaBean.categorias}"
                    var="c"
                    border="1">

                <h:column>

                    <f:facet name="header">
                        ID
                    </f:facet>

                    #{c.idCategoria}

                </h:column>

                <h:column>

                    <f:facet name="header">
                        Nombre
                    </f:facet>

                    #{c.nombre}

                </h:column>

                <h:column>

                    <f:facet name="header">
                        Descripción
                    </f:facet>

                    #{c.descripcion}

                </h:column>

                <h:column>

                    <f:facet name="header">
                        Estado
                    </f:facet>

                    #{c.activo ? 'Activa' : 'Inactiva'}

                </h:column>

                <h:column>

                    <f:facet name="header">
                        Acciones
                    </f:facet>

                    <h:commandButton
                            value="Editar"
                            action="#{categoriaBean.editar(c)}"
                            immediate="true">

                        <f:ajax
                                execute="@this"
                                render="@form"/>

                    </h:commandButton>

                    <h:commandButton
                            value="#{c.activo
                        ? 'Desactivar'
                        : 'Activar'}"
                            action="#{categoriaBean.alternarEstado(
                        c.idCategoria,
                        c.activo
                        )}"
                            immediate="true">

                        <f:ajax
                                execute="@this"
                                render="@form"/>

                    </h:commandButton>

                </h:column>

            </h:dataTable>

        </h:form>

    </main>

</h:body>

</html>
