<?xml version="1.0" encoding="UTF-8"?>

<!DOCTYPE html>

<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">

<f:metadata>

    <f:viewParam
            name="id"
            value="#{pedidoBean.idPublicacion}"/>

    <f:viewAction
            action="#{pedidoBean.cargarNuevaOrden}"
            onPostback="false"/>

</f:metadata>

<h:head>

    <title>
        Nuevo pedido - EmprendeLink
    </title>

    <link rel="stylesheet"
          href="#{request.contextPath}/css/estilos.css"/>

</h:head>

<h:body>

    <main>

        <h1>Realizar pedido</h1>

        <p>
            <a href="#{request.contextPath}/catalogo/index.xhtml">
                Volver al catálogo
            </a>
        </p>

        <h:messages id="mensajes"/>

        <h:panelGroup
                rendered="#{not empty pedidoBean.publicacion}">

            <h2>
                #{pedidoBean.publicacion.nombre}
            </h2>

            <p>
                Emprendimiento:
                #{pedidoBean.publicacion.emprendimiento.nombre}
            </p>

            <p>
                Tipo:
                #{pedidoBean.publicacion.tipo}
            </p>

            <p>
                Precio unitario:

                <h:outputText
                        value="#{pedidoBean.publicacion.precio}">

                    <f:convertNumber
                            type="currency"
                            currencySymbol="$"/>

                </h:outputText>
            </p>

            <h:panelGroup
                    rendered="#{pedidoBean.publicacion.tipo eq 'PRODUCTO'}">

                <p>
                    Stock disponible:
                    #{pedidoBean.publicacion.stock}
                </p>

            </h:panelGroup>

            <h:form id="pedidoForm">

                <h:outputLabel
                        for="cantidad"
                        value="Cantidad"/>

                <h:inputText
                        id="cantidad"
                        value="#{pedidoBean.cantidad}"
                        required="true"
                        requiredMessage="La cantidad es obligatoria.">

                    <f:validateLongRange
                            minimum="1"/>

                    <f:ajax
                            event="blur"
                            execute="@this"
                            render="cantidadMensaje"/>

                </h:inputText>

                <h:message
                        id="cantidadMensaje"
                        for="cantidad"/>

                <br/><br/>

                <h:outputLabel
                        for="observaciones"
                        value="Observaciones"/>

                <h:inputTextarea
                        id="observaciones"
                        value="#{pedidoBean.observaciones}"
                        rows="4"
                        cols="50"/>

                <br/><br/>

                <h:commandButton
                        value="Confirmar pedido"
                        action="#{pedidoBean.crear}"/>

            </h:form>

        </h:panelGroup>

    </main>

</h:body>

</html>
