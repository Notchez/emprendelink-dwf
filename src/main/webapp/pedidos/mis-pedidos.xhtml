<?xml version="1.0" encoding="UTF-8"?>

<!DOCTYPE html>

<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">

<h:head>

    <title>
        Mis pedidos - EmprendeLink
    </title>

    <link rel="stylesheet"
          href="#{request.contextPath}/css/estilos.css"/>

</h:head>

<h:body>

    <main>

        <h1>Mis pedidos</h1>

        <p>
            <a href="#{request.contextPath}/inicio.xhtml">
                Volver al inicio
            </a>
        </p>

        <p>
            <a href="#{request.contextPath}/catalogo/index.xhtml">
                Ver catálogo
            </a>
        </p>

        <h:messages/>

        <h:dataTable
                value="#{pedidoBean.misPedidos}"
                var="p"
                border="1">

            <h:column>

                <f:facet name="header">
                    ID
                </f:facet>

                #{p.idPedido}

            </h:column>

            <h:column>

                <f:facet name="header">
                    Emprendimiento
                </f:facet>

                #{p.emprendimiento.nombre}

            </h:column>

            <h:column>

                <f:facet name="header">
                    Total
                </f:facet>

                <h:outputText value="#{p.total}">

                    <f:convertNumber
                            type="currency"
                            currencySymbol="$"/>

                </h:outputText>

            </h:column>

            <h:column>

                <f:facet name="header">
                    Estado
                </f:facet>

                #{pedidoBean.etiquetaEstado(p.estado)}

            </h:column>

            <h:column>

                <f:facet name="header">
                    Fecha
                </f:facet>

                #{p.fechaPedido}

            </h:column>

            <h:column>

                <f:facet name="header">
                    Detalle
                </f:facet>

                <h:link
                        outcome="/pedidos/detalle.xhtml"
                        value="Ver pedido">

                    <f:param
                            name="id"
                            value="#{p.idPedido}"/>

                </h:link>

            </h:column>

        </h:dataTable>

    </main>

</h:body>

</html>
