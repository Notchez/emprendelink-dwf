<?xml version="1.0" encoding="UTF-8"?>

<!DOCTYPE html>

<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">

<h:head>
    <title>Catálogo - EmprendeLink</title>
    <link rel="stylesheet"
          href="#{request.contextPath}/css/estilos.css"/>
</h:head>

<h:body>

<main>

    <h1>Catálogo</h1>

    <p>
        <a href="#{request.contextPath}/login.xhtml">
            Iniciar sesión
        </a>
    </p>

    <h:form id="catalogoForm">

        <h:outputLabel
                for="texto"
                value="Buscar"/>

        <h:inputText
                id="texto"
                value="#{publicacionBean.filtroTexto}">

            <f:ajax
                    event="keyup"
                    execute="@this"
                    render="resultados"/>

        </h:inputText>

        <h:outputLabel
                for="tipo"
                value=" Tipo"/>

        <h:selectOneMenu
                id="tipo"
                value="#{publicacionBean.filtroTipo}">

            <f:selectItem
                    itemLabel="Todos"
                    itemValue="#{null}"/>

            <f:selectItems
                    value="#{publicacionBean.tipos}"
                    var="tipo"
                    itemValue="#{tipo}"
                    itemLabel="#{tipo}"/>

            <f:ajax
                    execute="@this"
                    render="resultados"/>

        </h:selectOneMenu>

        <h:outputLabel
                for="categoria"
                value=" Categoría"/>

        <h:selectOneMenu
                id="categoria"
                value="#{publicacionBean.filtroCategoriaId}">

            <f:selectItem
                    itemLabel="Todas"
                    itemValue="#{null}"/>

            <f:selectItems
                    value="#{publicacionBean.categoriasActivas}"
                    var="c"
                    itemValue="#{c.idCategoria}"
                    itemLabel="#{c.nombre}"/>

            <f:ajax
                    execute="@this"
                    render="resultados"/>

        </h:selectOneMenu>

        <h:panelGroup
                id="resultados"
                layout="block">

            <h:dataTable
                    value="#{publicacionBean.catalogoFiltrado}"
                    var="p"
                    border="1">

                <h:column>
                    <f:facet name="header">Nombre</f:facet>
                    #{p.nombre}
                </h:column>

                <h:column>
                    <f:facet name="header">Tipo</f:facet>
                    #{p.tipo}
                </h:column>

                <h:column>
                    <f:facet name="header">Categoría</f:facet>
                    #{p.categoria.nombre}
                </h:column>

                <h:column>
                    <f:facet name="header">Emprendimiento</f:facet>
                    #{p.emprendimiento.nombre}
                </h:column>

                <h:column>
                    <f:facet name="header">Precio</f:facet>
                    <h:outputText value="#{p.precio}">
                        <f:convertNumber
                                type="currency"
                                currencySymbol="$"/>
                    </h:outputText>
                </h:column>

                <h:column>
                    <f:facet name="header">Detalle</f:facet>

                    <h:link
                            outcome="/catalogo/detalle.xhtml"
                            value="Ver detalle">

                        <f:param
                                name="id"
                                value="#{p.idPublicacion}"/>

                    </h:link>

                </h:column>

            </h:dataTable>

        </h:panelGroup>

    </h:form>

</main>

</h:body>

</html>
