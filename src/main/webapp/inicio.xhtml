<?xml version="1.0" encoding="UTF-8"?>

<!DOCTYPE html>

<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html">

<h:head>

    <title>
        Inicio - EmprendeLink
    </title>

    <link rel="stylesheet"
          href="#{request.contextPath}/css/estilos.css"/>

</h:head>

<h:body>

    <main>

        <h1>EmprendeLink</h1>

        <p>
            Bienvenido,
            <strong>
                #{authBean.usuario.nombre}
                #{authBean.usuario.apellido}
            </strong>
        </p>

        <p>
            Rol:
            #{authBean.usuario.rol.nombre}
        </p>

        <h:form>

            <h:commandButton
                    value="Cerrar sesión"
                    action="#{authBean.cerrarSesion}"/>

        </h:form>

    </main>

</h:body>

</html>
