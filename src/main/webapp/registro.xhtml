<?xml version="1.0" encoding="UTF-8"?>

<!DOCTYPE html>

<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets">

<ui:composition template="/WEB-INF/base.xhtml">

    <ui:define name="title">
        Crear cuenta - EmprendeLink
    </ui:define>

    <ui:define name="content">

        <section class="auth-layout">

            <div class="auth-brand">

                <span class="brand-mark">E</span>

                <h1>Crear cuenta</h1>

                <p>
                    Empieza a comprar o vender en EmprendeLink.
                </p>

            </div>

            <div class="auth-card">

                <h:form id="registroForm">

                    <h:messages
                            id="mensajes"
                            styleClass="messages"
                            globalOnly="true"/>

                    <div class="form-grid">

                        <div class="form-group">

                            <h:outputLabel
                                    for="nombre"
                                    value="Nombre"/>

                            <h:inputText
                                    id="nombre"
                                    value="#{usuarioBean.nombre}"
                                    required="true"
                                    requiredMessage="El nombre es obligatorio."
                                    maxlength="80"/>

                            <h:message
                                    styleClass="field-error"
                                    for="nombre"/>

                        </div>

                        <div class="form-group">

                            <h:outputLabel
                                    for="apellido"
                                    value="Apellido"/>

                            <h:inputText
                                    id="apellido"
                                    value="#{usuarioBean.apellido}"
                                    required="true"
                                    requiredMessage="El apellido es obligatorio."
                                    maxlength="80"/>

                            <h:message
                                    styleClass="field-error"
                                    for="apellido"/>

                        </div>

                        <div class="form-group full">

                            <h:outputLabel
                                    for="correo"
                                    value="Correo"/>

                            <h:inputText
                                    id="correo"
                                    value="#{usuarioBean.correo}"
                                    required="true"
                                    requiredMessage="El correo es obligatorio."
                                    validator="correoValidator"
                                    maxlength="120">

                                <f:ajax
                                        event="blur"
                                        execute="@this"
                                        render="correoMensaje"/>

                            </h:inputText>

                            <h:message
                                    id="correoMensaje"
                                    styleClass="field-error"
                                    for="correo"/>

                        </div>

                        <div class="form-group full">

                            <h:outputLabel
                                    for="contrasena"
                                    value="ContraseÃ±a"/>

                            <h:inputSecret
                                    id="contrasena"
                                    value="#{usuarioBean.contrasena}"
                                    required="true"
                                    requiredMessage="La contraseÃ±a es obligatoria."
                                    validator="contrasenaValidator"
                                    maxlength="128"/>

                            <h:message
                                    styleClass="field-error"
                                    for="contrasena"/>

                        </div>

                        <div class="form-group">

                            <h:outputLabel
                                    for="telefono"
                                    value="TelÃ©fono"/>

                            <h:inputText
                                    id="telefono"
                                    value="#{usuarioBean.telefono}"
                                    maxlength="20"/>

                        </div>

                        <div class="form-group">

                            <h:outputLabel
                                    for="rol"
                                    value="Tipo de cuenta"/>

                            <h:selectOneMenu
                                    id="rol"
                                    value="#{usuarioBean.rol}"
                                    converter="tipoRolConverter"
                                    required="true">

                                <f:selectItems
                                        value="#{usuarioBean.rolesRegistro}"
                                        var="rol"
                                        itemValue="#{rol}"
                                        itemLabel="#{usuarioBean.etiquetaRol(rol)}"/>

                                <f:ajax
                                        event="change"
                                        execute="@this"
                                        render="rolInfo"/>

                            </h:selectOneMenu>

                        </div>

                    </div>

                    <h:panelGroup
                            id="rolInfo"
                            layout="block">

                        <p class="muted small">
                            #{usuarioBean.descripcionRol}
                        </p>

                    </h:panelGroup>

                    <div class="button-row">

                        <h:commandButton
                                value="Crear cuenta"
                                styleClass="btn btn-primary"
                                action="#{usuarioBean.registrar}"/>

                    </div>

                </h:form>

                <div class="auth-footer">

                    Â¿Ya tienes cuenta?

                    <a href="#{request.contextPath}/login.xhtml">
                        <strong>Ingresar</strong>
                    </a>

                </div>

            </div>

        </section>

    </ui:define>

</ui:composition>

</html>
