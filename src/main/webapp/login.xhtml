<?xml version="1.0" encoding="UTF-8"?>

<!DOCTYPE html>

<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets">

<ui:composition template="/WEB-INF/templates/base.xhtml">

    <ui:define name="title">
        Iniciar sesión - EmprendeLink
    </ui:define>

    <ui:define name="content">

        <section class="auth-layout">

            <div class="auth-brand">

                <span class="brand-mark">E</span>

                <h1>Bienvenido</h1>

                <p>
                    Ingresa a tu cuenta para continuar.
                </p>

            </div>

            <div class="auth-card">

                <ui:fragment
                        rendered="#{param.registro eq 'exitoso'}">

                    <div class="messages">
                        Registro completado.
                        Ya puedes iniciar sesión.
                    </div>

                </ui:fragment>

                <h:form id="loginForm">

                    <h:messages
                            id="mensajes"
                            styleClass="messages"
                            globalOnly="true"/>

                    <div class="form-group">

                        <h:outputLabel
                                for="correo"
                                value="Correo"/>

                        <h:inputText
                                id="correo"
                                value="#{authBean.correo}"
                                required="true"
                                requiredMessage="El correo es obligatorio."
                                validator="correoValidator"
                                maxlength="120">

                            <f:ajax
                                    event="blur"
                                    execute="@this"
                                    render="correoMensaje"/>

                        </h:inputText>

                        <h:message
                                id="correoMensaje"
                                styleClass="field-error"
                                for="correo"/>

                    </div>

                    <br/>

                    <div class="form-group">

                        <h:outputLabel
                                for="contrasena"
                                value="Contraseña"/>

                        <h:inputSecret
                                id="contrasena"
                                value="#{authBean.contrasena}"
                                required="true"
                                requiredMessage="La contraseña es obligatoria."
                                maxlength="128"/>

                        <h:message
                                styleClass="field-error"
                                for="contrasena"/>

                    </div>

                    <div class="button-row">

                        <h:commandButton
                                value="Ingresar"
                                styleClass="btn btn-primary"
                                action="#{authBean.iniciarSesion}"/>

                    </div>

                </h:form>

                <div class="auth-footer">

                    ¿No tienes cuenta?

                    <a href="#{request.contextPath}/registro.xhtml">
                        <strong>Crear cuenta</strong>
                    </a>

                </div>

            </div>

        </section>

    </ui:define>

</ui:composition>

</html>
